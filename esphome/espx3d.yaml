esphome:
  name: espx3d
  includes:
    - encoding.h
    - encoding.c
    - struct.h
    - log.cpp

external_components:
  - source: components

spi:
  clk_pin: GPIO14
  miso_pin: GPIO12
  mosi_pin: GPIO13

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "EspX2D Fallback Hotspot"
    password: !secret ap_password

captive_portal:

web_server:
    port: 80
    auth:
        username: admin
        password: !secret web_server_password

espx3d:
  id: cc1101_x3d
  csn_pin: D8
  gdo0_pin: D2
  gdo2_pin: D1
  wellcom_remotes:
    - id: remote1
      device_id: 0x112233
      network_id: 1
    - id: remote2
      device_id: 0x112234
      network_id: 1

button:
  - platform: template
    name: Associate Remote 1
    on_press:
      - lambda: id(remote1)->associate();
  - platform: template
    name: Remote 1 Up
    on_press:
      - lambda: id(remote1)->up();
  - platform: template
    name: Remote 1 Down
    on_press:
      - lambda: id(remote1)->down();
  - platform: template
    name: Remote 1 Stop
    on_press:
      - lambda: id(remote1)->stop();
  - platform: template
    name: Remote 1 Stop Up
    on_press:
      - lambda: id(remote1)->stop_up();
  - platform: template
    name: Remote 1 Stop Down
    on_press:
      - lambda: id(remote1)->stop_down();
  - platform: template
    name: Associate Remote 2
    on_press:
      - lambda: id(remote2)->associate();
  - platform: template
    name: Remote 2 Up
    on_press:
      - lambda: id(remote2)->up();
  - platform: template
    name: Remote 2 Down
    on_press:
      - lambda: id(remote2)->down();
  - platform: template
    name: Remote 2 Stop
    on_press:
      - lambda: id(remote2)->stop();
  - platform: template
    name: Remote 2 Stop Up
    on_press:
      - lambda: id(remote2)->stop_up();
  - platform: template
    name: Remote 2 Stop Down
    on_press:
      - lambda: id(remote2)->stop_down();
