esphome:
  name: espx2d
  includes:
    - encoding.h
    - encoding.c
    - struct.h
    - log.cpp

external_components:
  - source: components

spi:
  clk_pin: GPIO14
  miso_pin: GPIO12
  mosi_pin: GPIO13

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "EspX2D Fallback Hotspot"
    password: !secret ap_password

captive_portal:

web_server:
    port: 80
    auth:
        username: admin
        password: !secret web_server_password

espx2d:
  id: cc1101_x2d
  csn_pin: D8
  gdo0_pin: D2
  gdo2_pin: D1
  actuators:
    - id: zone1LevelActuator
      house_id: 12136
      zone_id: 1
    - id: zone2LevelActuator
      house_id: 12136
      zone_id: 2
    - id: zone3LevelActuator
      house_id: 12136
      zone_id: 3

text_sensor:
  - platform: espx2d
    id: zone1LevelSensor
    name: Status Zone 1
    x2d_id: cc1101_x2d
    house_id: 12136
    zone_id: 1
  - platform: espx2d
    id: zone2LevelSensor
    name: Status Zone 2
    x2d_id: cc1101_x2d
    house_id: 12136
    zone_id: 2
  - platform: espx2d
    id: zone3LevelSensor
    name: Status Zone 3
    x2d_id: cc1101_x2d
    house_id: 12136
    zone_id: 3

select:
  - platform: template
    id: zone1LevelOrder
    name: "Order Zone 1"
    optimistic: true
    options:
      - None
      - Reduced
      - Moderato
      - Medio
      - Confort
      - Stop
      - AntiFrost
      - Special
      - Auto
      - Centralized
    on_value:
      then:
        - script.execute: update_zone1
  - platform: template
    id: zone2LevelOrder
    name: "Order Zone 2"
    optimistic: true
    options:
      - None
      - Reduced
      - Moderato
      - Medio
      - Confort
      - Stop
      - AntiFrost
      - Special
      - Auto
      - Centralized
    on_value:
      then:
        - script.execute: update_zone2
  - platform: template
    id: zone3LevelOrder
    name: "Order Zone 3"
    optimistic: true
    options:
      - None
      - Reduced
      - Moderato
      - Medio
      - Confort
      - Stop
      - AntiFrost
      - Special
      - Auto
      - Centralized
    on_value:
      then:
        - script.execute: update_zone3


script:
  - id: update_zone1
    then:
      - logger.log:
          format: "Order Zone 1: %s"
          args: ["id(zone1LevelOrder).state.c_str()"]
      - if:
          condition:
            - lambda: |-
                return (strcmp(id(zone1LevelOrder).state.c_str(), "None") == 0);
          then:
            lambda: |-
              id(zone1LevelActuator)->setNone();
      - if:
          condition:
            - lambda: |-
                return (strcmp(id(zone1LevelOrder).state.c_str(), "Reduced") == 0);
          then:
            lambda: |-
              id(zone1LevelActuator)->setReduced();
      - if:
          condition:
            - lambda: |-
                return (strcmp(id(zone1LevelOrder).state.c_str(), "Moderato") == 0);
          then:
            lambda: |-
              id(zone1LevelActuator)->setModerato();
      - if:
          condition:
            - lambda: |-
                return (strcmp(id(zone1LevelOrder).state.c_str(), "Medio") == 0);
